name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-docx pypdf pdfplumber pypdfium2

      - name: Install LibreOffice & fonts (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice fonts-crosextra-carlito

      - name: Run automated test suite
        run: |
          python tests/run_all.py

      - name: Run environment check
        run: |
          python skills/resume-from-projects/scripts/check_env.py --no-libreoffice

      - name: Run full environment check with LibreOffice (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          python skills/resume-from-projects/scripts/check_env.py
