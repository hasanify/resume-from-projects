name: Feature request
description: Suggest an idea or enhancement for resume-from-projects
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Suggest enhancements such as new project scanner heuristics, agent integrations, or layout templates.
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of what the problem or friction is.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see implemented.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any examples, mockups, or references. Note that proposals must adhere to the zero-hallucination and single-page invariants.
